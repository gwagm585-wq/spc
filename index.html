// 근사식 (강의록 08, p.15~16) : n>25(또는 51)인 경우 사용
function gammaFn(x) {
  // Lanczos approximation for Gamma function
  const g = 7;
  const p = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313, -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
  if (x < 0.5) {
    return Math.PI / (Math.sin(Math.PI * x) * gammaFn(1 - x));
  }
  x -= 1;
  let a = p[0];
  const t = x + g + 0.5;
  for (let i = 1; i < g + 2; i++) a += p[i] / (x + i);
  return Math.sqrt(2 * Math.PI) * Math.pow(t, x + 0.5) * Math.exp(-t) * a;
}
function c4Exact(n) {
  if (n <= 1) return null;
  return Math.sqrt(2 / (n - 1)) * (gammaFn(n / 2) / gammaFn((n - 1) / 2));
}
function c2Exact(n) {
  if (n <= 1) return null;
  return Math.sqrt(2 / n) * (gammaFn(n / 2) / gammaFn((n - 1) / 2));
}

// 불편화 상수 통합 조회 함수 (테이블 우선, 범위 밖이면 근사식/근사값)
function unbiasedConst(name, n) {
  n = Math.round(n);
  if (n < 2) n = 2;
  if (name === 'c4') {
    if (n <= 25 && C4_TABLE[n] != null) return C4_TABLE[n];
    return c4Exact(n);
  }
  if (name === 'c2') {
    if (n <= 25 && C4_TABLE[n] != null) {
      // c2 근사: 강의록 식 사용 (정확식)
      return c2Exact(n);
    }
    return c2Exact(n);
  }
  if (name === 'd2') {
    if (n <= 25 && D2_TABLE[n] != null) return D2_TABLE[n];
    return 3.4873 + 0.0250141 * n - 0.00009823 * n * n;
  }
  if (name === 'd3') {
    if (n <= 25 && D3_TABLE[n] != null) return D3_TABLE[n];
    return 0.80818 - 0.051871 * n + 0.00005098 * n * n - 0.00000019 * n * n * n;
  }
  if (name === 'd4') {
    if (n <= 25 && D4_TABLE[n] != null) return D4_TABLE[n];
    return 2.88606 + 0.051313 * n - 0.00049243 * n * n + 0.00000188 * n * n * n;
  }
  // 관리도용 (A2,A3,D3,D4,B3,B4): 테이블 범위(2~25) 밖이면 마지막 값 사용
  if (['A2', 'A3', 'D3', 'D4', 'B3', 'B4'].includes(name)) {
    const key = Math.min(Math.max(n, 2), 25);
    return CTRL_TABLE[key][name];
  }
  return null;
}
function ctrlConst(n) {
  const key = Math.min(Math.max(Math.round(n), 2), 25);
  return CTRL_TABLE[key];
}

// ---------- 기초 통계 함수 ----------
function mean(arr) {
  if (!arr || arr.length === 0) return NaN;
  return arr.reduce((a, b) => a + b, 0) / arr.length;
}
function stdSample(arr) {
  // ddof=1 (표본표준편차)
  if (!arr || arr.length < 2) return NaN;
  const m = mean(arr);
  const sumSq = arr.reduce((a, b) => a + (b - m) ** 2, 0);
  return Math.sqrt(sumSq / (arr.length - 1));
}
function range(arr) {
  if (!arr || arr.length === 0) return NaN;
  return Math.max(...arr) - Math.min(...arr);
}

// 정규분포 PDF / CDF (근사)
function normPdf(x, mu, sigma) {
  if (sigma <= 0) return 0;
  const z = (x - mu) / sigma;
  return Math.exp(-0.5 * z * z) / (sigma * Math.sqrt(2 * Math.PI));
}
// erf 근사 (Abramowitz-Stegun)
function erf(x) {
  const sign = x < 0 ? -1 : 1;
  x = Math.abs(x);
  const a1 = 0.254829592,
    a2 = -0.284496736,
    a3 = 1.421413741,
    a4 = -1.453152027,
    a5 = 1.061405429,
    p = 0.3275911;
  const t = 1 / (1 + p * x);
  const y = 1 - ((((a5 * t + a4) * t + a3) * t + a2) * t + a1) * t * Math.exp(-x * x);
  return sign * y;
}
function normCdf(x, mu = 0, sigma = 1) {
  return 0.5 * (1 + erf((x - mu) / (sigma * Math.sqrt(2))));
}
// 표준정규 분위수(역함수) 근사 (Acklam's algorithm)
function normInv(p) {
  if (p <= 0) return -Infinity;
  if (p >= 1) return Infinity;
  const a = [-3.969683028665376e+01, 2.209460984245205e+02, -2.759285104469687e+02, 1.383577518672690e+02, -3.066479806614716e+01, 2.506628277459239e+00];
  const b = [-5.447609879822406e+01, 1.615858368580409e+02, -1.556989798598866e+02, 6.680131188771972e+01, -1.328068155288572e+01];
  const c = [-7.784894002430293e-03, -3.223964580411365e-01, -2.400758277161838e+00, -2.549732539343734e+00, 4.374664141464968e+00, 2.938163982698783e+00];
  const d = [7.784695709041462e-03, 3.224671290700398e-01, 2.445134137142996e+00, 3.754408661907416e+00];
  const plow = 0.02425;
  let q, r;
  if (p < plow) {
    q = Math.sqrt(-2 * Math.log(p));
    return (((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) / ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1);
  } else if (p > 1 - plow) {
    q = Math.sqrt(-2 * Math.log(1 - p));
    return -(((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) / ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1);
  } else {
    q = p - 0.5;
    r = q * q;
    return (((((a[0] * r + a[1]) * r + a[2]) * r + a[3]) * r + a[4]) * r + a[5]) * q / (((((b[0] * r + b[1]) * r + b[2]) * r + b[3]) * r + b[4]) * r + 1);
  }
}

// ---------- Shapiro-Wilk 근사 검정 ----------
// 간이 구현: 표본이 작을 때도 동작하는 근사적 Shapiro-Wilk (Royston 근사)
function shapiroWilk(data) {
  const x = [...data].sort((a, b) => a - b);
  const n = x.length;
  if (n < 3) return {
    stat: null,
    p: null
  };
  const m = x.map((_, i) => normInv((i + 1 - 0.375) / (n + 0.25)));
  const mSqSum = m.reduce((a, v) => a + v * v, 0);
  const c = m.map(v => v / Math.sqrt(mSqSum));
  const xMean = mean(x);
  let num = 0;
  for (let i = 0; i < n; i++) num += c[i] * x[i];
  num = num * num;
  let den = 0;
  for (let i = 0; i < n; i++) den += (x[i] - xMean) ** 2;
  const W = den > 0 ? num / den : 1;

  // Royston(1992) p-value 근사
  let pValue;
  try {
    const lnN = Math.log(n);
    let mu, sigma;
    if (n <= 11) {
      const gamma = -2.273 + 0.459 * n;
      const w = -Math.log(gamma - Math.log(1 - W));
      mu = 0.5440 - 0.39978 * n + 0.025054 * n * n - 0.0006714 * n * n * n;
      sigma = Math.exp(1.3822 - 0.77857 * n + 0.062767 * n * n - 0.0020322 * n * n * n);
      const z = (w - mu) / sigma;
      pValue = 1 - normCdf(z);
    } else {
      const w = Math.log(1 - W);
      mu = -1.5861 - 0.31082 * lnN - 0.083751 * lnN * lnN + 0.0038915 * lnN ** 3;
      sigma = Math.exp(-0.4803 - 0.082676 * lnN + 0.0030302 * lnN * lnN);
      const z = (w - mu) / sigma;
      pValue = 1 - normCdf(z);
    }
  } catch (e) {
    pValue = null;
  }
  if (pValue != null) pValue = Math.min(Math.max(pValue, 0), 1);
  return {
    stat: W,
    p: pValue
  };
}

// Q-Q plot용 이론적 분위수 계산
function qqPoints(data) {
  const n = data.length;
  const xMean = mean(data);
  const xStd = stdSample(data);
  const z = data.map(v => xStd > 0 ? (v - xMean) / xStd : 0);
  const sortedIdx = z.map((v, i) => i).sort((a, b) => z[a] - z[b]);
  const sortedZ = sortedIdx.map(i => z[i]);
  const theoretical = sortedZ.map((_, i) => normInv((i + 1 - 0.5) / n));
  return theoretical.map((t, i) => ({
    x: t,
    y: sortedZ[i]
  }));
}

// ---------- Box-Cox 변환 ----------
function boxcoxTransform(data, lambdaRange = [-3, 3], step = 0.01) {
  // 양수 데이터만 가능. 최대우도(로그우도) 근사로 최적 lambda 탐색
  if (data.some(v => v <= 0)) return null;
  const n = data.length;
  const logData = data.map(v => Math.log(v));
  const sumLog = logData.reduce((a, b) => a + b, 0);
  function transform(y, lambda) {
    return Math.abs(lambda) < 1e-8 ? Math.log(y) : (Math.pow(y, lambda) - 1) / lambda;
  }
  function logLikelihood(lambda) {
    const yT = data.map(v => transform(v, lambda));
    const yMean = mean(yT);
    const ssq = yT.reduce((a, v) => a + (v - yMean) ** 2, 0) / n;
    if (ssq <= 0) return -Infinity;
    return -(n / 2) * Math.log(ssq) + (lambda - 1) * sumLog;
  }
  let bestLambda = 1,
    bestLL = -Infinity;
  for (let l = lambdaRange[0]; l <= lambdaRange[1]; l += step) {
    const ll = logLikelihood(l);
    if (ll > bestLL) {
      bestLL = ll;
      bestLambda = l;
    }
  }
  const transformed = data.map(v => transform(v, bestLambda));
  return {
    lambda: bestLambda,
    transformed
  };
}

// 공정능력분석 (Process Capability)
// data: [{ subgroup: string, value: number }]
// ============================================================
function processCapability(rows, LSL, USL) {
  const groups = {};
  rows.forEach(r => {
    if (!groups[r.subgroup]) groups[r.subgroup] = [];
    groups[r.subgroup].push(r.value);
  });
  const groupKeys = Object.keys(groups);
  const k = groupKeys.length;
  const allValues = rows.map(r => r.value);
  const n = allValues.length;
  const xBar = mean(allValues);
  const sigmaHat = stdSample(allValues); // 전체 표본표준편차
  const c4n = unbiasedConst('c4', n);
  const sigmaOverall = sigmaHat / c4n;

  // 합동표준편차 (군내변동) - 부분군 표준편차의 평균을 RMS로 합동
  const sigmaSg = groupKeys.map(g => stdSample(groups[g]));
  const validSigmaSg = sigmaSg.filter(v => !isNaN(v));
  const sigmaP = Math.sqrt(validSigmaSg.reduce((a, v) => a + v * v, 0) / validSigmaSg.length);
  const d = n - k + 1;
  const c4d = unbiasedConst('c4', d);
  const sigmaWithin = sigmaP / c4d;
  const Cp = (USL - LSL) / (6 * sigmaWithin);
  const Cpk = Math.min((USL - xBar) / (3 * sigmaWithin), (xBar - LSL) / (3 * sigmaWithin));
  const Pp = (USL - LSL) / (6 * sigmaOverall);
  const Ppk = Math.min((USL - xBar) / (3 * sigmaOverall), (xBar - LSL) / (3 * sigmaOverall));

  // Cpm (목표값 고려, target 미지정시 중심값 사용) - 부가 지수
  const target = (USL + LSL) / 2;
  const tau = Math.sqrt(sigmaOverall * sigmaOverall + (xBar - target) ** 2);
  const Cpm = (USL - LSL) / (6 * tau);

  // ppm 불량률 추정 (정규분포 가정, overall 기준)
  const zUSL = (USL - xBar) / sigmaOverall;
  const zLSL = (xBar - LSL) / sigmaOverall;
  const pAboveUSL = 1 - normCdf(zUSL);
  const pBelowLSL = 1 - normCdf(zLSL);
  const ppmTotal = (pAboveUSL + pBelowLSL) * 1e6;
  return {
    n,
    k,
    xBar,
    sigmaHat,
    sigmaOverall,
    sigmaWithin,
    sigmaP,
    Cp,
    Cpk,
    Pp,
    Ppk,
    Cpm,
    ppmTotal,
    pAboveUSL: pAboveUSL * 1e6,
    pBelowLSL: pBelowLSL * 1e6,
    groupMeans: groupKeys.map(g => ({
      subgroup: g,
      mean: mean(groups[g]),
      std: stdSample(groups[g]),
      n: groups[g].length
    }))
  };
}

// ============================================================
// 관리도 (Control Charts) - 계량형: Xbar-R, Xbar-S, I-MR
// ============================================================
function generateValueChart(rows, chartType = 'Xbar-R', window = 2) {
  const groups = {};
  const order = [];
  rows.forEach(r => {
    if (!groups[r.subgroup]) {
      groups[r.subgroup] = [];
      order.push(r.subgroup);
    }
    groups[r.subgroup].push(r.value);
  });
  if (chartType === 'Xbar-R' || chartType === 'Xbar-S') {
    const sg = order.map(g => ({
      subgroup: g,
      xbar: mean(groups[g]),
      r: range(groups[g]),
      s: stdSample(groups[g]),
      n: groups[g].length
    }));
    const xbarBar = mean(sg.map(s => s.xbar));
    const counts = sg.map(s => s.n);
    const modeN = mode(counts);
    if (chartType === 'Xbar-R') {
      const rBar = mean(sg.map(s => s.r));
      const {
        A2,
        D3,
        D4
      } = ctrlConst(modeN);
      const xbarChart = sg.map(s => ({
        subgroup: s.subgroup,
        point: s.xbar,
        CL: xbarBar,
        LCL: xbarBar - A2 * rBar,
        UCL: xbarBar + A2 * rBar
      }));
      const rChart = sg.map(s => ({
        subgroup: s.subgroup,
        point: s.r,
        CL: rBar,
        LCL: Math.max(0, D3 * rBar),
        UCL: D4 * rBar
      }));
      return {
        primary: xbarChart,
        secondary: rChart,
        primaryLabel: 'X̄',
        secondaryLabel: 'R',
        meta: {
          xbarBar,
          rBar,
          n: modeN
        }
      };
    } else {
      const sBar = mean(sg.map(s => s.s));
      const {
        A3,
        B3,
        B4
      } = ctrlConst(modeN);
      const xbarChart = sg.map(s => ({
        subgroup: s.subgroup,
        point: s.xbar,
        CL: xbarBar,
        LCL: xbarBar - A3 * sBar,
        UCL: xbarBar + A3 * sBar
      }));
      const sChart = sg.map(s => ({
        subgroup: s.subgroup,
        point: s.s,
        CL: sBar,
        LCL: Math.max(0, B3 * sBar),
        UCL: B4 * sBar
      }));
      return {
        primary: xbarChart,
        secondary: sChart,
        primaryLabel: 'X̄',
        secondaryLabel: 's',
        meta: {
          xbarBar,
          sBar,
          n: modeN
        }
      };
    }
  }
  if (chartType === 'I-MR') {
    const w = window;
    const values = rows.map(r => r.value);
    const labels = rows.map(r => r.subgroup);
    const xbar = mean(values);
    const mrAll = [];
    for (let i = 0; i < values.length; i++) {
      if (i < w - 1) {
        mrAll.push(NaN);
        continue;
      }
      const slice = values.slice(i - w + 1, i + 1);
      mrAll.push(range(slice));
    }
    const validMr = mrAll.filter(v => !isNaN(v));
    const mrBar = mean(validMr);
    const D3 = unbiasedConst('D3', w);
    const D4 = unbiasedConst('D4', w);
    const d2 = unbiasedConst('d2', w);
    const iChart = labels.map((lab, i) => ({
      subgroup: lab,
      point: values[i],
      CL: xbar,
      LCL: xbar - 3 * mrBar / d2,
      UCL: xbar + 3 * mrBar / d2
    }));
    const mrChart = labels.map((lab, i) => ({
      subgroup: lab,
      point: mrAll[i],
      CL: mrBar,
      LCL: Math.max(0, D3 * mrBar),
      UCL: D4 * mrBar
    }));
    return {
      primary: iChart,
      secondary: mrChart,
      primaryLabel: 'I',
      secondaryLabel: 'MR',
      meta: {
        xbar,
        mrBar,
        window: w
      }
    };
  }
  return null;
}
function mode(arr) {
  const freq = {};
  arr.forEach(v => {
    freq[v] = (freq[v] || 0) + 1;
  });
  let best = arr[0],
    bestCount = 0;
  Object.keys(freq).forEach(k => {
    if (freq[k] > bestCount) {
      bestCount = freq[k];
      best = Number(k);
    }
  });
  return best;
}

// ============================================================
// 관리도 - 계수형: NP, P, C, U
// rows: [{ subgroup, n (sample_size), count }]
// ============================================================
function generateCountChart(rows, chartType = 'NP') {
  const order = rows.map(r => r.subgroup);
  const counts = rows.map(r => r.count);
  const sizes = rows.map(r => r.n);
  if (chartType === 'NP') {
    const k = rows.length;
    const npBar = mean(counts);
    const pBar = counts.reduce((a, b) => a + b, 0) / sizes.reduce((a, b) => a + b, 0);
    const chart = order.map((g, i) => ({
      subgroup: g,
      point: counts[i],
      CL: npBar,
      LCL: Math.max(0, npBar - 3 * Math.sqrt(npBar * (1 - pBar))),
      UCL: npBar + 3 * Math.sqrt(npBar * (1 - pBar))
    }));
    return {
      primary: chart,
      primaryLabel: 'NP',
      meta: {
        npBar,
        pBar
      }
    };
  }
  if (chartType === 'P') {
    const pBar = counts.reduce((a, b) => a + b, 0) / sizes.reduce((a, b) => a + b, 0);
    const chart = order.map((g, i) => ({
      subgroup: g,
      point: counts[i] / sizes[i],
      CL: pBar,
      LCL: Math.max(0, pBar - 3 * Math.sqrt(pBar * (1 - pBar) / sizes[i])),
      UCL: Math.min(1, pBar + 3 * Math.sqrt(pBar * (1 - pBar) / sizes[i]))
    }));
    return {
      primary: chart,
      primaryLabel: 'P',
      meta: {
        pBar
      }
    };
  }
  if (chartType === 'C') {
    const cBar = mean(counts);
    const chart = order.map((g, i) => ({
      subgroup: g,
      point: counts[i],
      CL: cBar,
      LCL: Math.max(0, cBar - 3 * Math.sqrt(cBar)),
      UCL: cBar + 3 * Math.sqrt(cBar)
    }));
    return {
      primary: chart,
      primaryLabel: 'C',
      meta: {
        cBar
      }
    };
  }
  if (chartType === 'U') {
    const uBar = counts.reduce((a, b) => a + b, 0) / sizes.reduce((a, b) => a + b, 0);
    const chart = order.map((g, i) => ({
      subgroup: g,
      point: counts[i] / sizes[i],
      CL: uBar,
      LCL: Math.max(0, uBar - 3 * Math.sqrt(uBar / sizes[i])),
      UCL: uBar + 3 * Math.sqrt(uBar / sizes[i])
    }));
    return {
      primary: chart,
      primaryLabel: 'U',
      meta: {
        uBar
      }
    };
  }
  return null;
}

// ============================================================
// Nelson's Rule (8가지 이상판정 규칙) - 강의록 09, p.4
// chartPoints: [{ point, CL, UCL, LCL }], sigma는 (UCL-CL)/3 로 추정
// ============================================================
function nelsonRules(chartPoints) {
  const n = chartPoints.length;
  const CL = chartPoints[0]?.CL ?? 0;
  const sigma = chartPoints[0] ? (chartPoints[0].UCL - chartPoints[0].CL) / 3 : 0;
  const pts = chartPoints.map(p => p.point);
  const violations = Array.from({
    length: n
  }, () => []);
  const addV = (i, ruleNo, label) => violations[i].push({
    rule: ruleNo,
    label
  });

  // Rule 1: 1점이 ±3σ를 벗어남
  for (let i = 0; i < n; i++) {
    if (pts[i] > CL + 3 * sigma || pts[i] < CL - 3 * sigma) addV(i, 1, 'Rule1: 3σ 이탈');
  }
  // Rule 2: 연속 9점이 중심선 한쪽에 존재
  for (let i = 8; i < n; i++) {
    const slice = pts.slice(i - 8, i + 1);
    if (slice.every(v => v > CL) || slice.every(v => v < CL)) {
      for (let j = i - 8; j <= i; j++) addV(j, 2, 'Rule2: 9점 한쪽편');
    }
  }
  // Rule 3: 연속 6점이 계속 증가 또는 감소
  for (let i = 5; i < n; i++) {
    const slice = pts.slice(i - 5, i + 1);
    let inc = true,
      dec = true;
    for (let j = 1; j < slice.length; j++) {
      if (slice[j] <= slice[j - 1]) inc = false;
      if (slice[j] >= slice[j - 1]) dec = false;
    }
    if (inc || dec) for (let j = i - 5; j <= i; j++) addV(j, 3, 'Rule3: 6점 추세');
  }
  // Rule 4: 연속 14점이 번갈아 증감(진동)
  for (let i = 13; i < n; i++) {
    const slice = pts.slice(i - 13, i + 1);
    let alt = true;
    for (let j = 2; j < slice.length; j++) {
      const d1 = slice[j] - slice[j - 1];
      const d2 = slice[j - 1] - slice[j - 2];
      if (d1 * d2 >= 0) {
        alt = false;
        break;
      }
    }
    if (alt) for (let j = i - 13; j <= i; j++) addV(j, 4, 'Rule4: 14점 진동');
  }
  // Rule 5: 연속 3점 중 2점이 같은 방향으로 2σ 초과
  for (let i = 2; i < n; i++) {
    const slice = pts.slice(i - 2, i + 1);
    const aboveCount = slice.filter(v => v > CL + 2 * sigma).length;
    const belowCount = slice.filter(v => v < CL - 2 * sigma).length;
    if (aboveCount >= 2 || belowCount >= 2) for (let j = i - 2; j <= i; j++) addV(j, 5, 'Rule5: 3점중 2점 2σ초과');
  }
  // Rule 6: 연속 5점 중 4점이 같은 방향으로 1σ 초과
  for (let i = 4; i < n; i++) {
    const slice = pts.slice(i - 4, i + 1);
    const aboveCount = slice.filter(v => v > CL + sigma).length;
    const belowCount = slice.filter(v => v < CL - sigma).length;
    if (aboveCount >= 4 || belowCount >= 4) for (let j = i - 4; j <= i; j++) addV(j, 6, 'Rule6: 5점중 4점 1σ초과');
  }
  // Rule 7: 연속 15점이 모두 ±1σ 이내
  for (let i = 14; i < n; i++) {
    const slice = pts.slice(i - 14, i + 1);
    if (slice.every(v => v < CL + sigma && v > CL - sigma)) {
      for (let j = i - 14; j <= i; j++) addV(j, 7, 'Rule7: 15점 1σ이내(층화)');
    }
  }
  // Rule 8: 연속 8점이 모두 ±1σ 밖(양쪽 다 존재)
  for (let i = 7; i < n; i++) {
    const slice = pts.slice(i - 7, i + 1);
    const allOutside = slice.every(v => v > CL + sigma || v < CL - sigma);
    const hasAbove = slice.some(v => v > CL + sigma);
    const hasBelow = slice.some(v => v < CL - sigma);
    if (allOutside && hasAbove && hasBelow) for (let j = i - 7; j <= i; j++) addV(j, 8, 'Rule8: 8점 1σ밖 양측');
  }
  return violations;
}

// ============================================================
// 데이터 생성기 (강의록 시뮬레이션 함수 포팅)
// ============================================================
function randNormal(mean = 0, std = 1) {
  // Box-Muller
  let u = 0,
    v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return mean + std * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function randUniform(a, b) {
  return a + Math.random() * (b - a);
}
function randBinomial(n, p) {
  let count = 0;
  for (let i = 0; i < n; i++) if (Math.random() < p) count++;
  return count;
}
function generateValueData({
  varName = 'value',
  target = 0,
  tolerance = 1,
  sgName = 'subgroup',
  numSg = 20,
  sgSize = 5,
  sgStd = 1,
  meanShift = 0.2,
  sgSizeVariation = 0
}) {
  const rows = [];
  for (let i = 0; i < numSg; i++) {
    const shift = randUniform(-meanShift, meanShift);
    const variation = sgSizeVariation > 0 ? Math.floor(randUniform(-sgSizeVariation, sgSizeVariation + 1)) : 0;
    const n = Math.max(1, sgSize + variation);
    for (let j = 0; j < n; j++) {
      rows.push({
        subgroup: `${sgName}_${i + 1}`,
        value: randNormal(target + shift, sgStd)
      });
    }
  }
  return {
    rows,
    LSL: target - tolerance,
    USL: target + tolerance,
    varName,
    sgName
  };
}
function generateCountData({
  sgName = 'lot',
  numSg = 20,
  sgSize = 200,
  p = 0.02,
  sgSizeVariation = 0
}) {
  const rows = [];
  for (let i = 0; i < numSg; i++) {
    const variation = sgSizeVariation > 0 ? Math.floor(randUniform(-sgSizeVariation, sgSizeVariation + 1)) : 0;
    const n = Math.max(1, sgSize + variation);
    rows.push({
      subgroup: `${sgName}_${i + 1}`,
      n,
      count: randBinomial(n, p)
    });
  }
  return {
    rows,
    sgName
  };
}

// ---------- 히스토그램 bin 계산 ----------
function histogramBins(data, nbins = 20) {
  const minV = Math.min(...data);
  const maxV = Math.max(...data);
  const width = (maxV - minV) / nbins || 1;
  const bins = Array.from({
    length: nbins
  }, (_, i) => ({
    x0: minV + i * width,
    x1: minV + (i + 1) * width,
    count: 0
  }));
  data.forEach(v => {
    let idx = Math.floor((v - minV) / width);
    if (idx >= nbins) idx = nbins - 1;
    if (idx < 0) idx = 0;
    bins[idx].count++;
  });
  return bins;
}

// ============================================================
// [신규] 관리도 자동추천 — 강의록 09-p.3 "Choose Appropriate Control Chart" 도식 로직화
// ============================================================
// path: 추천 과정에서 거친 분기 노드 목록(시각화용), result: 최종 추천 차트, reason: 근거 텍스트
function recommendChart({
  dataType,
  subgroupSize,
  defectKind,
  sizeConstant
}) {
  // dataType: 'value' | 'count'
  // subgroupSize: 평균 부분군 크기 (계량형일 때만 사용)
  // defectKind: 'defects'(결점) | 'defectives'(불량) — 계수형일 때만 사용
  // sizeConstant: true(표본크기 일정) | false(표본크기 가변) — 계수형일 때만 사용
  const path = [{
    node: '데이터 타입',
    value: dataType === 'value' ? 'CONTINUOUS (계량형)' : 'ATTRIBUTE (계수형)'
  }];
  if (dataType === 'value') {
    path.push({
      node: '부분군 크기',
      value: subgroupSize <= 1 ? '1 (개별값)' : subgroupSize <= 9 ? `${subgroupSize} (2~9)` : `${subgroupSize} (10 이상)`
    });
    let result, reason;
    if (subgroupSize <= 1) {
      result = 'I-MR';
      reason = '부분군 크기가 1(개별 관측치)이므로 이동범위(Moving Range)를 이용하는 I-MR 관리도가 적합합니다.';
    } else if (subgroupSize <= 9) {
      result = 'Xbar-R';
      reason = '부분군 크기가 2~9개 범위이므로 평균-범위(X̄-R) 관리도가 적합합니다. (강의록 적용가이드: 부분군 크기 1~10)';
    } else {
      result = 'Xbar-S';
      reason = '부분군 크기가 10개 이상이므로 평균-표준편차(X̄-S) 관리도가 적합합니다. (강의록 적용가이드: 부분군 크기 10 이상)';
    }
    path.push({
      node: '추천 결과',
      value: result
    });
    return {
      result,
      reason,
      path
    };
  } else {
    path.push({
      node: '결점 유형',
      value: defectKind === 'defects' ? 'DEFECTS (결점수)' : 'DEFECTIVES (불량)'
    });
    path.push({
      node: '표본 크기',
      value: sizeConstant ? 'CONSTANT (일정)' : 'VARIABLE (가변)'
    });
    let result, reason;
    if (defectKind === 'defects') {
      result = sizeConstant ? 'C' : 'U';
      reason = sizeConstant ? '결점수(defects) 데이터이고 표본 크기가 동일하므로 C 관리도가 적합합니다.' : '결점수(defects) 데이터이고 표본 크기가 매번 다르므로 단위당 결점수(U) 관리도가 적합합니다.';
    } else {
      result = sizeConstant ? 'NP' : 'P';
      reason = sizeConstant ? '불량(defectives) 데이터이고 표본 크기가 동일하므로 NP 관리도가 적합합니다.' : '불량(defectives) 데이터이고 표본 크기가 매번 다르므로 불량률(P) 관리도가 적합합니다.';
    }
    path.push({
      node: '추천 결과',
      value: result
    });
    return {
      result,
      reason,
      path
    };
  }
}

// ============================================================

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  const headers = lines[0].split(',').map(h => h.trim());
  const data = lines.slice(1).filter(l => l.trim().length > 0).map(line => {
    const cells = line.split(',').map(c => c.trim());
    const obj = {};
    headers.forEach((h, i) => {
      obj[h] = cells[i];
    });
    return obj;
  });
  return {
    headers,
    data
  };
}
